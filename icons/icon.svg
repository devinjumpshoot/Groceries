<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Shopping Trolley Body -->
  <g transform="translate(60, 60)">
    <!-- Cart wheels -->
    <circle cx="140" cy="320" r="28" fill="#10b981" filter="url(#glow)"/>
    <circle cx="140" cy="320" r="14" fill="#ffffff"/>
    <circle cx="280" cy="320" r="28" fill="#10b981" filter="url(#glow)"/>
    <circle cx="280" cy="320" r="14" fill="#ffffff"/>

    <!-- Cart Basket Grid -->
    <path d="M60 70 L100 70 L150 250 L310 250 L345 130 L115 130" 
          fill="none" stroke="#38bdf8" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    
    <path d="M130 190 L325 190" stroke="#38bdf8" stroke-width="14" stroke-linecap="round"/>
    <path d="M185 130 L175 250" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
    <path d="M245 130 L240 250" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
    <path d="M305 130 L295 250" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>

    <!-- Shield / Safety Check in top right -->
    <g transform="translate(220, 20) scale(0.9)">
      <circle cx="100" cy="100" r="75" fill="#0f172a" stroke="#10b981" stroke-width="12"/>
      <path d="M100 45 L150 68 V115 C150 148 128 178 100 186 C72 178 50 148 50 115 V68 Z" fill="url(#accentGrad)"/>
      <path d="M80 112 L94 126 L126 94" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Indonesian Rupiah Accent Sparkle -->
    <text x="70" y="200" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="52" fill="#34d399" opacity="0.95">Rp</text>
  </g>
</svg>
